name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        java: [25]
        architecture: [x64]
        include:
          - os: ubuntu-24.04-arm
            java: 25
            architecture: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          distribution: 'zulu'
          cache: 'maven'
      - name: Build project
        run: ./mvnw --batch-mode verify

  sonar:
    name: sonar
    # secrets are not available to pull requests from forks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'
          cache: 'maven'
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw --batch-mode -Psonar verify sonar:sonar -Dsonar.token="$SONAR_TOKEN"
